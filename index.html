<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1E3D">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mis Cuentas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<style>
@font-face{font-family:"Instrument Serif";font-style:normal;font-weight:400;font-display:swap;src:url("instrument-serif-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Instrument Serif";font-style:italic;font-weight:400;font-display:swap;src:url("instrument-serif-latin-400-italic.woff2") format("woff2")}
@font-face{font-family:"Instrument Sans";font-style:normal;font-weight:400;font-display:swap;src:url("instrument-sans-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Instrument Sans";font-style:normal;font-weight:500;font-display:swap;src:url("instrument-sans-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Instrument Sans";font-style:normal;font-weight:600;font-display:swap;src:url("instrument-sans-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Instrument Sans";font-style:normal;font-weight:700;font-display:swap;src:url("instrument-sans-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"Source Serif 4";font-style:normal;font-weight:400;font-display:swap;src:url("source-serif-4-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Source Serif 4";font-style:normal;font-weight:500;font-display:swap;src:url("source-serif-4-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Source Serif 4";font-style:normal;font-weight:600;font-display:swap;src:url("source-serif-4-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Source Serif 4";font-style:normal;font-weight:700;font-display:swap;src:url("source-serif-4-latin-700-normal.woff2") format("woff2")}
/* Layout: una columna tipo app móvil; resumen del periodo arriba, gráficos y lista debajo, pestañas fijas abajo y botón flotante para añadir */
:root{
  --bg:#F5F6F9; --surface:#FFFFFF; --ink:#0F1E3D; --muted:#6B7590; --line:#E2E6EE;
  --accent:#1B2F5E; --accent-ink:#F6F1E6; --accent-soft:#E7EBF4; --gold:#A8854A; --warn:#A4472A; --warn-soft:#F6E9E2;
  --ok:#3E7C5F; --ok-soft:#E1EEE7; --del:#9E2F45; --shadow:0 8px 28px rgba(15,30,61,.12);
  --bar-bg:#0F1E3D; --bar-ink:#9AA6C2; --bar-active:#E4CB94; --today-bg:#DDB86C; --today-ink:#0F1E3D;
  --k-var:#2E4C8C; --k-plan:#C2913F; --k-fix:#9AA3B8;
  --f-display:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-ui:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Source Serif 4","Iowan Old Style",Georgia,serif;
  --tab-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09111F; --surface:#101B31; --ink:#EEEAE0; --muted:#8C96AE; --line:#1E2A45;
  --accent:#D2B67E; --accent-ink:#09111F; --accent-soft:#1B2844; --gold:#D2B67E; --warn:#E39A72; --warn-soft:#33221B;
  --ok:#74B796; --ok-soft:#16302A; --del:#E5788C; --shadow:0 8px 28px rgba(0,0,0,.45);
  --bar-bg:#0C1628; --bar-ink:#7D88A3; --bar-active:#D2B67E; --today-bg:#E8C57F; --today-ink:#09111F; --k-var:#8FA9E0; --k-plan:#D2B67E; --k-fix:#5F6A85; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09111F; --surface:#101B31; --ink:#EEEAE0; --muted:#8C96AE; --line:#1E2A45;
  --accent:#D2B67E; --accent-ink:#09111F; --accent-soft:#1B2844; --gold:#D2B67E; --warn:#E39A72; --warn-soft:#33221B;
  --ok:#74B796; --ok-soft:#16302A; --del:#E5788C; --shadow:0 8px 28px rgba(0,0,0,.45);
  --bar-bg:#0C1628; --bar-ink:#7D88A3; --bar-active:#D2B67E; --today-bg:#E8C57F; --today-ink:#09111F; --k-var:#8FA9E0; --k-plan:#D2B67E; --k-fix:#5F6A85; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(var(--tab-h) + 96px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums}

/* Cabecera de periodo */
.eyebrow{font-family:var(--f-ui);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
.phead{display:flex;align-items:flex-end;gap:8px}
.phead .tt{flex:1;min-width:0}
.hday{font-family:var(--f-display);font-weight:400;font-size:42px;line-height:1.02;letter-spacing:-.01em;margin:6px 0 0;text-wrap:balance}
.hday em{font-style:italic;color:var(--gold)}
.icbtn{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.icbtn svg{width:20px;height:20px}
.pill{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px;font-family:var(--f-ui)}
.rule{height:1px;background:var(--line);margin:14px 0 0;position:relative}
.rule::after{content:"";position:absolute;left:0;top:0;width:44px;height:2px;background:var(--gold)}

/* Resumen */
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.sum small{display:block;font-family:var(--f-ui);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sum b{display:block;font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.15;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.sum .in b{color:var(--ok)}
.sum .bal.neg b{color:var(--del)}
.sum .bal{background:var(--accent);border-color:var(--accent)}
.sum .bal small{color:var(--accent-ink);opacity:.75}
.sum .bal b{color:var(--accent-ink)}
.sum .bal.neg{background:var(--surface);border-color:var(--del)}
.sum .bal.neg small{color:var(--del);opacity:1}

.section-t{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:28px 0 10px;font-family:var(--f-ui);font-weight:700;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase}
.section-t small{font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:none}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}

/* Gráficos */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--f-ui);fill:var(--muted);font-size:10.5px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .g{fill:var(--accent)}
.chart .gt{fill:var(--today-bg)}
.chart .i{fill:var(--ok)}
.chart .val{fill:var(--ink);font-weight:600}
.legend{display:flex;gap:14px;font-family:var(--f-ui);font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--line);gap:2px}
.stack span{display:block;height:100%;background:var(--cat)}
.catrows{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.crow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.crow .dot{width:10px;height:10px;border-radius:50%;background:var(--cat)}
.crow .nm{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .am{font-family:var(--f-ui);font-weight:600;font-variant-numeric:tabular-nums;font-size:14.5px}
.crow .pc{grid-column:2/4;display:flex;align-items:center;gap:8px;font-family:var(--f-ui);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter{flex:1;height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--cat);border-radius:99px}
.crow.over .pc{color:var(--del);font-weight:600}
.crow.over .meter i{background:var(--del)}
.crow.near .pc{color:var(--warn);font-weight:600}
.status{font-family:var(--f-ui);font-size:11px;font-weight:700;letter-spacing:.04em;padding:1px 7px;border-radius:99px;white-space:nowrap}
.status.over{background:var(--del);color:var(--surface)}
.status.near{background:var(--warn-soft);color:var(--warn)}
.status.okk{background:var(--ok-soft);color:var(--ok)}

/* Movimientos */
.day-h{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 6px;font-family:var(--f-ui);font-size:12.5px;font-weight:700;color:var(--muted);text-transform:capitalize}
.day-h:first-child{margin-top:0}
.list{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.mrow{position:relative;border-radius:12px;transition:opacity .25s,transform .25s}
.mrow.gone{opacity:0;transform:translateX(-40px)}
.swbg{position:absolute;inset:0;border-radius:12px;display:none;align-items:center;justify-content:flex-end;padding:0 18px;font-family:var(--f-ui);font-weight:700;font-size:14px;background:var(--del);color:var(--surface)}
.mrow.swiping .swbg{display:flex}
.mov{position:relative;display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px 11px 11px;text-align:left;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.mov.anim{transition:transform .22s ease}
.ava{flex:none;width:36px;height:36px;border-radius:50%;background:var(--cat);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:19px;line-height:1}
.mtx{flex:1;min-width:0}
.mtx b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mtx span{display:flex;flex-wrap:wrap;gap:3px 8px;align-items:center;font-size:13px;color:var(--muted);overflow:hidden}
.mtx svg{vertical-align:-2px}
.tag{font-family:var(--f-ui);background:var(--accent-soft);color:var(--accent);padding:0 7px;border-radius:99px;font-size:11.5px;font-weight:600}
.amt{flex:none;font-family:var(--f-ui);font-weight:600;font-variant-numeric:tabular-nums;font-size:15.5px}
.amt.in{color:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:26px 16px;border:1px solid var(--line);background:var(--surface);border-radius:12px}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-weight:400;font-size:24px;margin-bottom:2px}
.tip{font-family:var(--f-ui);font-size:12.5px;color:var(--muted);text-align:center;margin-top:16px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:14px;margin-top:16px}
.banner.warn{background:var(--warn-soft)}
.banner .row{display:flex;gap:6px}
.banner button{font-family:var(--f-ui);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600}
.upcoming{display:flex;flex-direction:column;gap:6px}
.up{display:flex;align-items:center;gap:10px;font-size:14.5px;padding:2px 0}
.up .dot{width:8px;height:8px;border-radius:50%;background:var(--cat);flex:none}
.up .d{font-family:var(--f-ui);font-size:12px;color:var(--muted);width:52px;flex:none}
.up .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up .a{font-family:var(--f-ui);font-weight:600;font-variant-numeric:tabular-nums}
.up .a.in{color:var(--ok)}

/* Ajustes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
.card h2{font-family:var(--f-display);font-size:24px;font-weight:400;margin:0 0 6px}
.card p{margin:0 0 12px;color:var(--muted);font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{font-family:var(--f-ui);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--del);border-color:color-mix(in srgb,var(--del) 40%,var(--line))}
.btn.danger.solid{background:var(--del);color:var(--surface);border-color:var(--del)}
.linkbtn{font-family:var(--f-ui);background:none;border:0;color:var(--accent);font-weight:600;padding:6px 0;font-size:14px}
textarea.data{width:100%;min-height:110px;margin-top:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
ol.steps{margin:0;padding-left:20px;color:var(--muted);font-size:14px;display:grid;gap:4px}
ol.steps b{color:var(--ink)}
.catlist{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.catrow{display:flex;align-items:center;gap:8px}
.sw{flex:none;width:32px;height:32px;border-radius:10px;border:0;background:var(--cat);padding:0}
.catrow input{min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:15px}
.catrow .nmi{flex:1}
.catrow .bud{width:92px;flex:none;text-align:right;font-family:var(--f-ui)}
.catrow .x{flex:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;padding:0}
.cathead{display:flex;gap:8px;font-family:var(--f-ui);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 44px 0 40px}
.cathead span:first-child{flex:1}
.cathead span:last-child{width:92px;text-align:right}
.palette{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 6px 40px}
.palette button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;background:var(--cat);padding:0}
.palette button[aria-pressed="true"]{border-color:var(--ink)}
.fxrow{display:flex;align-items:center;gap:10px;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left}
.fxrow .dot{width:10px;height:10px;border-radius:50%;background:var(--cat);flex:none}
.fxrow .n{flex:1;min-width:0}
.fxrow .n small{display:block;font-family:var(--f-ui);font-size:12px;color:var(--muted)}
.fxrow .a{font-family:var(--f-ui);font-weight:600;font-variant-numeric:tabular-nums}
.fxrow .a.in{color:var(--ok)}
.backup-when{font-family:var(--f-ui);font-size:13px;color:var(--muted);margin-top:10px}

/* Barra inferior y botón */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar-bg);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{display:flex;width:100%;max-width:560px}
.tab{flex:1;height:var(--tab-h);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--f-ui);font-size:11.5px;font-weight:600;letter-spacing:.03em;color:var(--bar-ink)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--bar-active)}
.fab{position:fixed;z-index:21;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom,0px));height:56px;padding:0 20px 0 16px;border-radius:16px;border:1px solid var(--gold);background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:8px;font-family:var(--f-ui);font-weight:600;font-size:15px;box-shadow:var(--shadow)}
.fab svg{width:22px;height:22px}

/* Hoja */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(6,12,26,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:20px 20px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:92vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-family:var(--f-display);font-size:28px;font-weight:400;margin:0 0 14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:14px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{text-align:center;padding:9px;border-radius:9px;font-family:var(--f-ui);font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.seg input:checked+label{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(15,30,61,.12)}
.seg input#tI:checked+label{color:var(--ok)}
.seg input:focus-visible+label{outline:2px solid var(--gold)}
.amount{display:flex;align-items:baseline;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px;padding-bottom:4px}
.amount input{flex:1;min-width:0;border:0;background:none;font-family:var(--f-display);font-size:52px;line-height:1.1;padding:0;outline:none;font-variant-numeric:tabular-nums}
.amount span{font-family:var(--f-display);font-size:34px;color:var(--muted)}
.amount:focus-within{border-color:var(--gold)}
.err{font-family:var(--f-ui);color:var(--del);font-size:13px;margin:-8px 0 10px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.field>label,.field>.lbl{font-family:var(--f-ui);font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--muted);margin:-4px 0 12px}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:14.5px;cursor:pointer}
.cats label i{width:10px;height:10px;border-radius:50%;background:var(--cat)}
.cats input{position:absolute;opacity:0;pointer-events:none}
.cats input:checked+label{background:var(--cat);border-color:var(--cat);color:#fff;font-weight:600}
.cats input:checked+label i{background:#fff}
.cats input:focus-visible+label{outline:2px solid var(--gold);outline-offset:2px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;cursor:pointer}
.switch b{display:block;font-weight:600}
.switch small{color:var(--muted);font-size:13px}
.switch input{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .2s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked{background:var(--gold)}
.switch input:checked::after{transform:translateX(18px)}
.sheet .actions{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.sheet .actions .grow{flex:1}
.confirm{background:var(--warn-soft);border-radius:12px;padding:12px;margin-top:10px;font-size:14px}
.confirm .row{margin-top:8px}

/* Genera los movimientos de los fijos que ya tocan */
function runFixed(){
  const td = today(), cur = ym(td);
  state.fixed.forEach(f => {
    f.gen = f.gen || [];
    for (let m = f.start; m <= cur; m = addMonths(m,1)) {
      if (f.gen.includes(m)) continue;
      const date = m+"-"+pad(Math.min(f.day, lastDayOf(m)));
      if (date > td) break;
      state.movs.push({id:uid(),type:f.type,amount:f.amount,cat:f.cat,sub:f.sub||"",date,note:f.note,fixed:f.id,ex:f.ex||undefined});
      f.gen.push(m);
    }
  });
}

  const ids = budCats().map(c => c.id);

function history(){
  const map = {};
  state.movs.forEach(m => {
    if (!m.note || m.fixed) return;
    const k = norm(m.note), e = map[k];
    if (!e) map[k] = {note:m.note,type:m.type,cat:m.cat,sub:m.sub||"",plan:!!m.plan,amount:m.amount,count:1,last:m.date};
    else { e.count++; if (m.date >= e.last) Object.assign(e,{note:m.note,type:m.type,cat:m.cat,sub:m.sub||"",plan:!!m.plan,amount:m.amount,last:m.date}); }
  });
  return Object.values(map);
}

function bindSwipe(li, card, onLeft){
  let x0=0,y0=0,dx=0,active=false,axis=null,pid=null;
  card.addEventListener("pointerdown", e => { if (e.pointerType==="mouse" && e.button!==0) return; x0=e.clientX; y0=e.clientY; dx=0; active=true; axis=null; pid=e.pointerId; card.classList.remove("anim"); });
  card.addEventListener("pointermove", e => {
    if (!active || e.pointerId!==pid) return;
    const mx = e.clientX-x0, my = e.clientY-y0;
    if (axis===null && (Math.abs(mx)>10 || Math.abs(my)>10)) { axis = Math.abs(mx)>Math.abs(my) && mx<0 ? "x" : "y"; if (axis==="x"){ try{card.setPointerCapture(pid);}catch(_){} li.classList.add("swiping"); } else active=false; }
    if (axis==="x") { dx = Math.min(0,mx); card.style.transform = "translateX("+dx+"px)"; }
  });
  const end = () => {
    if (!active) return; active = false; if (axis!=="x") return;
    li.dataset.sw = "1"; setTimeout(() => { delete li.dataset.sw; }, 80);
    const w = card.offsetWidth; card.classList.add("anim");
    if (dx < -Math.min(110,w*.3)) { card.style.transform = "translateX(-"+w+"px)"; setTimeout(onLeft, 180); }
    else { card.style.transform = ""; setTimeout(() => li.classList.remove("swiping"), 230); }
  };
  card.addEventListener("pointerup", end); card.addEventListener("pointercancel", end);
}

/* Desglose por categoría, con subcategorías, presupuesto y comparación */
function breakdown(list, withBudget, prevList){
  const g = list.filter(m => m.type==="g");
  const total = sum(g);
  const by = {}, subBy = {}, prevBy = {};
  g.forEach(m => { by[m.cat] = (by[m.cat]||0) + m.amount; const k = m.sub||""; subBy[m.cat] = subBy[m.cat]||{}; subBy[m.cat][k] = (subBy[m.cat][k]||0) + m.amount; });
  (prevList||[]).filter(m => m.type==="g").forEach(m => prevBy[m.cat] = (prevBy[m.cat]||0) + m.amount);
  if (withBudget) state.cats.filter(c => c.type==="g" && c.budget>0 && !by[c.id]).forEach(c => by[c.id] = 0);
  const ids = Object.keys(by).sort((a,b)=>by[b]-by[a]);
  if (!ids.length) return '';
  const stack = total ? '<div class="stack" role="img" aria-label="Reparto del gasto por categoría">'+ids.filter(id=>by[id]>0).map(id => '<span style="--cat:'+catOf(id).color+';width:'+(by[id]/total*100)+'%"></span>').join("")+'</div>' : '';
  const rows = ids.map(id => {
    const c = catOf(id), v = by[id], pct = total ? Math.round(v/total*100) : 0;
    let cls = "", pc = '<span>'+pct+' % del gasto</span>';
    if (prevList && prevBy[id] && v) { const d = Math.round((v-prevBy[id])/prevBy[id]*100); if (d) pc += '<span class="dl '+(d>0?'up':'down')+'">'+(d>0?'▲ ':'▼ ')+Math.abs(d)+' %</span>'; }
    if (withBudget && c.budget > 0) {
      const vv = sum(varG(list).filter(m => m.cat===id)), r = vv / c.budget;
      cls = r > 1 ? " over" : r >= .8 ? " near" : "";
      const st = r > 1 ? '<span class="status over">Te has pasado '+money0(vv-c.budget)+'</span>' : r >= .8 ? '<span class="status near">Quedan '+money0(c.budget-vv)+'</span>' : '<span class="status okk">Quedan '+money0(c.budget-vv)+'</span>';
      pc = '<span class="meter"><i style="width:'+Math.min(100,r*100)+'%"></i></span><span>de '+money0(c.budget)+'</span>'+st;
    }
    const sb = subBy[id] || {}, sk = Object.keys(sb).sort((a,b)=>sb[b]-sb[a]);
    const subsLine = (sk.length > 1 || (sk.length===1 && sk[0])) ? '<div class="subs-line">'+sk.map(k => '<span>'+esc(subOf(id,k) || (k ? 'Otra' : 'General'))+' '+money0(sb[k])+'</span>').join("")+'</div>' : '';
    return '<div class="crow'+cls+'" style="--cat:'+c.color+'"><span class="cic">'+icon(c.icon)+'</span><span class="nm">'+esc(c.name)+'</span><span class="am">'+money(v)+'</span><div class="pc">'+pc+'</div>'+subsLine+'</div>';
  }).join("");
  return '<div class="panel">'+stack+'<div class="catrows">'+rows+'</div></div>';
}

/* Gráficos */
function niceMax(v){ if (v <= 0) return 100; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function weekChart(){

  const max = niceMax(Math.max(...vals.map(x=>x.v)));
  const W=340,H=170,L=36,B=22,T=16,cw=(W-L)/7,bw=Math.min(26,cw*.56),ph=H-B-T;

  vals.forEach((x,i) => {

  });

function pairChart(data, label){
  const max = niceMax(Math.max(...data.map(d=>Math.max(d.i,d.g))));
  const n = data.length, W=340,H=180,L=40,B=22,T=10,cw=(W-L)/n,bw=Math.min(14,cw*.32),ph=H-B-T;

  [0,.5,1].forEach(f => { const y = T+ph*(1-f); s += '<line class="grid" x1="'+L+'" x2="'+W+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+3.5)+'" text-anchor="end">'+NFC.format(max*f)+'</text>'; });

/* Presupuesto semanal: la suma de los límites de cada categoría */
function weekBudgetPanel(a){
  const bc = budCats().slice().sort((p,q) => q.budget-p.budget), b = addDays(a,6), td = today(), wl = inRange(a,b), v = varG(wl);
  const head = '<div class="section-t"><span>Presupuesto semanal</span><small>Solo gastos variables</small></div>';
  if (!bc.length) return head + '<div class="empty"><b>Sin presupuesto</b>En Ajustes, pon un límite semanal a las categorías que quieras vigilar: Ocio, Alimentación…</div>';
  const B = totalBudget(), ids = bc.map(c => c.id), spent = sum(v.filter(m => ids.includes(m.cat))), r = spent/B;
  const isCur = td >= a && td <= b, past = td > b, bad = spent > B;
  let msg;
  if (bad) msg = 'Te has pasado '+money0(spent-B)+' esta semana.';
  else if (isCur) { const left = diffDays(td,b)+1; msg = 'Quedan '+money0(B-spent)+' · unos '+money0((B-spent)/left)+' al día hasta el domingo.'; }
  else if (past) msg = 'Semana cumplida: te sobraron '+money0(B-spent)+'.';
  else msg = 'Quedan '+money0(B-spent)+'.';
  const pace = isCur ? '<span class="pace" style="left:'+((diffDays(a,td)+1)/7*100)+'%" title="Día de la semana"></span>' : '';
  const rows = bc.map(c => {
    const vv = sum(v.filter(m => m.cat===c.id)), rr = vv/c.budget;
    const cls = rr > 1 ? " over" : rr >= .8 ? " near" : "";
    const st = rr > 1 ? '<span class="status over">+'+money0(vv-c.budget)+'</span>' : '<span class="status '+(rr>=.8?'near':'okk')+'">Quedan '+money0(c.budget-vv)+'</span>';
    return '<div class="crow'+cls+'" style="--cat:'+c.color+'"><span class="cic">'+icon(c.icon)+'</span><span class="nm">'+esc(c.name)+'</span><span class="am">'+money0(vv)+' <small>/ '+money0(c.budget)+'</small></span><div class="pc"><span class="meter"><i style="width:'+Math.min(100,rr*100)+'%"></i></span>'+st+'</div></div>';
  }).join("");
  const outside = sum(v.filter(m => !ids.includes(m.cat))), planned = wl.filter(m => m.type==="g" && m.plan), fixedW = sum(wl.filter(m => m.type==="g" && m.fixed));
  const foot = [];
  if (outside) foot.push('<span>Otros gastos variables sin límite: <b>'+money0(outside)+'</b></span>');
  if (planned.length) foot.push('<span>Planificados (no cuentan): <b>'+money0(sum(planned))+'</b> · '+planned.map(m => esc(m.note || subOf(m.cat,m.sub) || catOf(m.cat).name)).join(", ")+'</span>');
  if (fixedW) foot.push('<span>Fijos (no cuentan): <b>'+money0(fixedW)+'</b></span>');
  const st = streak();
  return head + '<div class="panel bigbud">'
    +'<div class="top"><b>'+money0(spent)+'</b><small>de '+money0(B)+'</small></div>'
    +'<div class="track'+(bad?' over':'')+'" role="img" aria-label="Llevas el '+Math.round(r*100)+' % del presupuesto"><i style="width:'+Math.min(100,r*100)+'%"></i>'+pace+'</div>'
    +'<p'+(bad?' class="bad"':'')+'>'+msg+'</p>'
    +(st ? '<span class="streak">Racha: '+st+' semana'+(st>1?'s':'')+' cumpliendo</span>' : '')
    +'<div class="catrows">'+rows+'</div>'
    +(foot.length ? '<div class="bfoot">'+foot.join("")+'</div>' : '')+'</div>';
}

/* ---------- previsión de fin de mes ---------- */
function forecastPanel(m){
  const td = today(); if (ym(td) !== m) return '';
  const day = parse(td).getDate(), last = lastDayOf(m), rem = last - day;
  const list = inRange(m+"-01", td), t = totals(list), v = sum(varG(list));
  const pend = state.fixed.filter(f => f.start <= m && !(f.gen||[]).includes(m) && m+"-"+pad(Math.min(f.day,last)) > td);
  const pg = sum(pend.filter(f => f.type==="g")), pi = sum(pend.filter(f => f.type==="i"));
  let rate = v / day, basis = "tu ritmo de gasto de este mes";
  if (day < 7) { let tot = 0, days = 0; for (let k=1;k<=3;k++){ const pm = addMonths(m,-k), [a,b] = monthRange(pm), l = varG(inRange(a,b)); if (l.length){ tot += sum(l); days += lastDayOf(pm); } } if (days) { rate = tot/days; basis = "tu ritmo de los últimos meses"; } }
  const G = t.g + pg + rate*rem, I = t.i + pi, B = I - G;
  return '<div class="section-t"><span>Previsión a fin de mes</span><small>Quedan '+rem+' día'+(rem===1?'':'s')+'</small></div><div class="panel fc">'
    +'<div class="lbl2">'+(B>=0?'Acabarías el mes ahorrando unos':'Acabarías el mes en negativo, unos')+'</div>'
    +'<div class="big '+(B>=0?'pos':'neg')+'">'+(B>=0?'+':'')+money0(B)+'</div>'
    +'<div class="rowx"><span>Gastos previstos <b>'+money0(G)+'</b></span><span>Ingresos previstos <b>'+money0(I)+'</b></span></div>'
    +'<p>Calculado con '+basis+' (unos '+money0(rate)+' al día en gastos variables) y los fijos que faltan por llegar.</p></div>';
}

/* ---------- retos ---------- */
function chStatus(c){
  const td = today(), end = addDays(c.start, c.days-1);
  const list = varG(inRange(c.start, end < td ? end : td)).filter(m => (!c.cat || m.cat===c.cat) && (!c.sub || m.sub===c.sub));
  const spent = sum(list), failed = c.kind==="zero" ? spent > 0 : spent > c.limit;
  const st = failed ? "lost" : td > end ? "won" : td < c.start ? "pend" : "live";
  return {st, spent, end, dayN: Math.max(0, Math.min(c.days, diffDays(c.start,td)+1))};
}
const chWhat = c => c.sub ? (subOf(c.cat,c.sub)||catOf(c.cat).name) : c.cat ? catOf(c.cat).name : "nada";
function challengesPanel(){
  const td = today(), m = ym(td), day = parse(td).getDate();
  let zero = 0; for (let d=1; d<=day; d++){ const s = m+"-"+pad(d); if (!sum(varG(inRange(s,s)))) zero++; }
  let run = 0, s = td; while (run < 400 && !sum(varG(inRange(s,s))) && s >= firstDate()) { run++; s = addDays(s,-1); }
  const order = {live:0, pend:1, won:2, lost:3};
  const list = state.challenges.map(c => ({c, x:chStatus(c)})).filter(o => o.x.st==="live" || o.x.st==="pend" || diffDays(o.x.end, td) <= 14).sort((p,q) => order[p.x.st]-order[q.x.st]);
  let h = '<div class="section-t"><span>Retos</span><button class="linkbtn" type="button" id="newCh" style="padding:0;letter-spacing:0;text-transform:none">+ Nuevo reto</button></div><div class="panel">'
    +'<div class="nospend"><div><b>'+zero+'</b><small>días sin gastar este mes</small></div><div><b>'+run+'</b><small>'+(run===1?'día':'días')+' seguidos sin gastar</small></div></div>';

  return h + list.map(({c,x}) => {
    const what = esc(chWhat(c));
    const pill = x.st==="live" ? '<span class="status live">Día '+x.dayN+' de '+c.days+'</span>' : x.st==="pend" ? '<span class="status pend">Empieza el '+shortDate(c.start)+'</span>' : x.st==="won" ? '<span class="status okk">Superado</span>' : '<span class="status over">No superado</span>';
    const w = x.st==="won"||x.st==="lost" ? 100 : x.st==="pend" ? 0 : x.dayN/c.days*100;
    const info = c.kind==="zero" ? (x.spent ? 'Gastaste '+money(x.spent)+' en '+what : '0 € gastados en '+what+(x.st==="live"?' · hasta el '+shortDate(x.end):''))
      : 'Llevas '+money(x.spent)+' de '+money0(c.limit)+' en '+what+(x.st==="live"?' · hasta el '+shortDate(x.end):'');
    return '<button type="button" class="ch '+x.st+'" data-ch="'+c.id+'"><div class="gt"><b>'+esc(c.name)+'</b>'+pill+'</div><div class="bar2"><i style="width:'+w+'%"></i></div><small>'+info+(c.ex?' · Ejemplo':'')+'</small></button>';
  }).join("") + '</div>';
}
function bindChallenges(){
  const n = document.getElementById("newCh"); if (n) n.addEventListener("click", () => openChallenge(null));

function checkChallenges(afterSave){
  let shown = false;
  state.challenges.forEach(c => {
    if (c.told) return;
    const x = chStatus(c);
    if (x.st === "won") { c.told = true; if (!shown) { shown = true; setTimeout(() => { celebrate(); toast("¡Reto superado: "+c.name+"!"); }, 500); } }
    else if (x.st === "lost") { c.told = true; if (afterSave && !shown) { shown = true; toast("Reto «"+c.name+"» no superado. ¡A por el siguiente!", null, true); } }
  });
  save();

}

  const on = (id,fn) => { const el = document.getElementById(id); if (el) el.addEventListener("click", fn); };

  all("[data-subn]", inp => { const c = state.cats.find(x => x.id===inp.dataset.of), s = c && c.subs.find(x => x.id===inp.dataset.subn), v = inp.value.trim(); if (s && v){ s.name = v; save(); toast("Subcategoría renombrada"); } else if (s) inp.value = s.name; }, "change");
  all("[data-delsub]", b => { const c = state.cats.find(x => x.id===b.dataset.of), idx = c.subs.findIndex(x => x.id===b.dataset.delsub), s = c.subs[idx]; c.subs.splice(idx,1); save(); render(); toast("«"+s.name+"» borrada", () => { c.subs.splice(idx,0,s); save(); render(); }); });
  $view.querySelectorAll("[data-addsub]").forEach(b => {

    b.addEventListener("click", add); inp.addEventListener("keydown", e => { if (e.key==="Enter") { e.preventDefault(); add(); } });

    b.addEventListener("click", add); inp.addEventListener("keydown", e => { if (e.key==="Enter") { e.preventDefault(); add(); } });
  });
  const json = () => JSON.stringify({app:"mis-cuentas",version:2,exported:new Date().toISOString(),cats:state.cats,fixed:state.fixed,goals:state.goals,challenges:state.challenges,weekBudget:state.weekBudget||0,movs:state.movs},null,1);
  const mark = () => { state.lastBackup = Date.now(); state.snooze = 0; save(); };
  function showExport(){ const b = document.getElementById("exportBox"); b.value = json(); b.hidden = false; b.focus(); b.select(); mark(); }
  on("dl", () => { try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([json()],{type:"application/json"})); a.download = "mis-cuentas-"+today()+".json"; document.body.appendChild(a); a.click(); a.remove(); mark(); render(); toast("Copia descargada"); } catch(e) { showExport(); } });
  on("cp", () => { try { navigator.clipboard.writeText(json()).then(() => { mark(); render(); toast("Datos copiados"); }, showExport); } catch(e) { showExport(); } });
  document.getElementById("file").addEventListener("change", e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => restore(r.result); r.readAsText(f); });
  on("restore", () => restore(document.getElementById("importBox").value));
  on("wipe", () => { confirmWipe = true; render(); });
  on("wipeYes", () => { state.movs = []; state.fixed = []; state.goals = []; state.challenges = []; save(); confirmWipe = false; render(); toast("Datos borrados"); });
  on("wipeNo", () => { confirmWipe = false; render(); });
}
function restore(txt){
  try {
    const d = JSON.parse(txt);
    if (!d || d.app !== "mis-cuentas" || !Array.isArray(d.movs) || d.movs.some(m => !/^\d{4}-\d{2}-\d{2}$/.test(m.date) || !(m.amount>0))) throw 0;
    state.movs = d.movs; if (Array.isArray(d.cats)) state.cats = d.cats; state.cats.forEach(c => { if (!Array.isArray(c.subs)) c.subs = []; });
    state.fixed = Array.isArray(d.fixed) ? d.fixed : []; state.goals = Array.isArray(d.goals) ? d.goals : []; state.challenges = Array.isArray(d.challenges) ? d.challenges : []; state.weekBudget = d.weekBudget || 0;
    runFixed(); save(); render(); toast("Copia restaurada: "+d.movs.length+" movimientos");
  } catch(e) { toast("Ese archivo no es una copia válida de Mis Cuentas", null, true); }
}

/* ---------- selector de categoría y subcategoría ---------- */
const $sheet = document.getElementById("sheetRoot");
function catChips(type, cur){
  return state.cats.filter(c => c.type===type).map(c => '<input type="radio" name="fCat" id="fc-'+c.id+'" value="'+c.id+'"'+(cur===c.id?' checked':'')+' style="--cat:'+c.color+'"><label for="fc-'+c.id+'" style="--cat:'+c.color+'"><span class="ci">'+icon(c.icon)+'</span>'+esc(c.name)+'</label>').join("");
}
function subChips(catId, cur){
  const c = catOf(catId);
  if (!c.subs.length) return '';
  return '<div class="field"><span class="lbl">Subcategoría de '+esc(c.name)+'</span><div class="cats subc" style="--cat:'+c.color+'">'
    +'<input type="radio" name="fSub" id="fs-none" value=""'+(!cur?' checked':'')+'><label for="fs-none" style="--cat:'+c.color+'">General</label>'
    + c.subs.map(s => '<input type="radio" name="fSub" id="fs-'+s.id+'" value="'+s.id+'"'+(cur===s.id?' checked':'')+'><label for="fs-'+s.id+'" style="--cat:'+c.color+'">'+esc(s.name)+'</label>').join("") + '</div></div>';
}
function catPicker(form, getType){
  const firstOf = t => (state.cats.find(c => c.type===t)||{}).id;
  const draw = (cat, sub) => {
    const t = getType(); cat = cat && catOf(cat).type===t ? cat : firstOf(t);
    form.querySelector("#catBox").innerHTML = catChips(t, cat);
    form.querySelector("#subBox").innerHTML = subChips(cat, sub);
  };
  form.addEventListener("change", e => { if (e.target.name==="fCat") form.querySelector("#subBox").innerHTML = subChips(e.target.value, ""); });
  return { draw, value: () => ({cat:(form.querySelector('input[name=fCat]:checked')||{}).value || firstOf(getType()), sub:(form.querySelector('input[name=fSub]:checked')||{}).value || ""}) };
}
const segHTML = type => '<div class="seg" role="radiogroup" aria-label="Tipo"><input type="radio" name="fType" id="tG" value="g"'+(type==="g"?' checked':'')+'><label for="tG">Gasto</label><input type="radio" name="fType" id="tI" value="i"'+(type==="i"?' checked':'')+'><label for="tI">Ingreso</label></div>';
const amountHTML = c => '<label class="amount" for="fAmt"><input id="fAmt" inputmode="decimal" autocomplete="off" placeholder="0" value="'+toInput(c)+'" aria-label="Importe en euros"><span>€</span></label><div class="err" id="amtErr" hidden>Escribe un importe mayor que cero.</div>';

/* ---------- hoja de movimiento ---------- */
function openSheet(m, date, preset){
  const editing = !!m, p = preset || {};
  let type = editing ? m.type : (p.type || "g");
  $sheet.innerHTML = '<div class="scrim" id="scrim"><form class="sheet" id="form" role="dialog" aria-modal="true" aria-labelledby="sT" novalidate>'

    +'<div class="field"><label for="fNote">Concepto (opcional)</label><input id="fNote" maxlength="60" autocomplete="off" placeholder="Mercadona" value="'+esc(editing ? (m.note||'') : (p.note||''))+'"><div class="sugg" id="sugg" hidden></div></div>'
    +'<div class="field"><span class="lbl">Categoría</span><div class="cats" id="catBox" role="radiogroup"></div></div><div id="subBox"></div>'

    +'<div class="field"><label for="fTag">Etiquetas (opcional)</label><div class="tagbox" id="tagBox"></div><div class="tsug" id="tSug"></div></div>'
    +'<div class="actions">'+(editing?'<button class="btn danger" type="button" id="fDel">Eliminar</button>':'')+'<span class="grow"></span><button class="btn" type="button" id="fCancel">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div>'
    +'<div id="delBox"></div></form></div>';
  const amt = document.getElementById("fAmt"), err = document.getElementById("amtErr"), form = document.getElementById("form"), note = document.getElementById("fNote"), sugg = document.getElementById("sugg");
  const picker = catPicker(form, () => type);
  picker.draw(editing ? m.cat : p.cat, editing ? m.sub : p.sub);
  let kind = editing ? (m.plan ? "plan" : "var") : (p.plan ? "plan" : "var");
  const KH = {var:"Cuenta para tu presupuesto semanal.", plan:"No cuenta para el presupuesto semanal. Para gastos que ya esperas pero sin fecha fija: abono de transporte, seguro, ITV…", fix:"Se apuntará solo el mismo día de cada mes y no cuenta para el presupuesto semanal.", once:"Un ingreso de una sola vez.", fixi:"Se apuntará solo el mismo día de cada mes."};
  const drawKind = () => {
    const box = document.getElementById("kindBox");
    if (editing && m.fixed) { box.innerHTML = '<p class="hint khint">Este movimiento viene de un fijo. Los cambios solo afectan a este mes; para cambiar el fijo, ve a Ajustes.</p>'; return; }
    if (type==="i" && kind==="plan") kind = "var";
    const opts = type==="g" ? [["var","Variable"],["plan","Planificado"]] : [["var","Puntual"]];
    if (!editing) opts.push(["fix","Fijo mensual"]);
    if (opts.length < 2) { box.innerHTML = ""; return; }
    const hint = type==="i" ? (kind==="fix" ? KH.fixi : KH.once) : KH[kind];
    box.innerHTML = '<div class="seg kseg'+(opts.length===3?' three':'')+'" role="radiogroup" aria-label="Tipo de gasto">'+opts.map(([v,l]) => '<input type="radio" name="fKind" id="k-'+v+'" value="'+v+'"'+(kind===v?' checked':'')+'><label for="k-'+v+'">'+l+'</label>').join("")+'</div><p class="hint khint">'+hint+'</p>';
    box.querySelectorAll('input[name=fKind]').forEach(r => r.addEventListener("change", () => { kind = r.value; drawKind(); }));
  };
  drawKind();
  setTimeout(() => { if (!editing) { amt.focus(); amt.select(); } }, 80);
  /* Etiquetas */
  let tags = editing ? (m.tags||[]).slice() : [];
  const known = allTags().map(t => t.name);
  const addTag = v => { v = v.replace(/^#+/,"").replace(/,/g," ").trim(); if (!v) return; const k = known.find(t => norm(t)===norm(v)) || v; if (!tags.some(t => norm(t)===norm(k))) tags.push(k); };
  const drawTags = focus => {
    const box = document.getElementById("tagBox");
    box.innerHTML = tags.map((t,i) => '<button type="button" class="tchip" data-rt="'+i+'" aria-label="Quitar etiqueta '+esc(t)+'">#'+esc(t)+' '+I_X+'</button>').join("") + '<input id="fTag" autocomplete="off" placeholder="'+(tags.length?'Otra…':'Roma, Boda de Ana…')+'">';
    const inp = document.getElementById("fTag");
    box.querySelectorAll("[data-rt]").forEach(b => b.addEventListener("click", () => { tags.splice(+b.dataset.rt,1); drawTags(true); }));
    const sugg2 = () => { const q = norm(inp.value.replace(/^#/,"")); const list = known.filter(t => !tags.some(x => norm(x)===norm(t)) && (!q || norm(t).includes(q))).slice(0,6);
      document.getElementById("tSug").innerHTML = list.map(t => '<button type="button" data-at="'+esc(t)+'">#'+esc(t)+'</button>').join("");
      document.querySelectorAll("#tSug [data-at]").forEach(b => b.addEventListener("click", () => { addTag(b.dataset.at); drawTags(true); })); };
    inp.addEventListener("keydown", e => { if (e.key==="Enter" || e.key===",") { e.preventDefault(); addTag(inp.value); drawTags(true); } else if (e.key==="Backspace" && !inp.value && tags.length) { tags.pop(); drawTags(true); } });
    inp.addEventListener("input", sugg2);
    sugg2();
    if (focus) inp.focus();
  };
  drawTags(false);
  amt.addEventListener("input", () => { err.hidden = true; });
  form.querySelectorAll('input[name=fType]').forEach(r => r.addEventListener("change", () => { type = r.value; picker.draw(null, ""); drawKind(); }));
  /* Conceptos recordados */
  const hist = history();
  const apply = h => {
    note.value = h.note; type = h.type;
    form.querySelector(h.type==="i" ? "#tI" : "#tG").checked = true;
    picker.draw(h.cat, h.sub);
    if (kind !== "fix") kind = h.plan ? "plan" : "var"; drawKind();
    if (!parseAmount(amt.value)) amt.value = toInput(h.amount);
    sugg.hidden = true; sugg.innerHTML = "";
  };
  note.addEventListener("input", () => {
    const q = norm(note.value);
    if (!q) { sugg.hidden = true; sugg.innerHTML = ""; return; }
    const hits = hist.filter(h => norm(h.note).includes(q) && norm(h.note) !== q).sort((a,b) => (norm(b.note).startsWith(q) - norm(a.note).startsWith(q)) || b.count-a.count).slice(0,4);
    sugg.hidden = !hits.length;
    sugg.innerHTML = hits.map((h,i) => { const sn = subOf(h.cat,h.sub); return '<button type="button" data-h="'+i+'"><span>'+esc(h.note)+'</span><small>'+esc(catOf(h.cat).name)+(sn?' › '+esc(sn):'')+' · '+money(h.amount)+'</small></button>'; }).join("");
    sugg.querySelectorAll("[data-h]").forEach(b => b.addEventListener("click", () => apply(hits[+b.dataset.h])));
  });
  note.addEventListener("change", () => { if (editing) return; const ex = hist.find(h => norm(h.note) === norm(note.value)); if (ex && ex.cat !== picker.value().cat) { type = ex.type; form.querySelector(ex.type==="i" ? "#tI" : "#tG").checked = true; picker.draw(ex.cat, ex.sub); } });

    const pend = document.getElementById("fTag"); if (pend && pend.value.trim()) addTag(pend.value);
    const own = editing && m.type==="g" && !m.fixed && !m.plan && monday(m.date)===monday(d) ? m.amount : 0;
    const beforeCat = spentWeek(cat, d) - (editing && m.cat===cat ? own : 0), beforeAll = spentBudgeted(d) - (editing && catOf(m.cat).budget > 0 ? own : 0);
    const rep = !editing && kind==="fix", plan = type==="g" && kind==="plan";
    if (rep) { state.fixed.push({id:uid(), type, amount, cat, sub, note:noteV, day:parse(d).getDate(), start:ym(d), gen:[]}); runFixed(); }
    else if (editing) { Object.assign(m, {type, amount, cat, sub, date:d, note:noteV, tags:tags.slice(), plan}); delete m.ex; if (!plan) delete m.plan; }
    else { const nm = {id:uid(), type, amount, cat, sub, date:d, note:noteV, tags:tags.slice()}; if (plan) nm.plan = true; state.movs.push(nm); }
    save(); closeSheet(); render();
    if (checkChallenges(true)) return;
    const msg = type==="g" && !rep && !plan && !(editing && m.fixed) ? budgetAlert(cat, d, beforeCat, beforeAll) : null;
    if (msg) toast(msg[0], null, msg[1]);
    else toast(rep ? "Fijo creado: se apuntará el día "+parse(d).getDate()+" de cada mes" : editing ? "Movimiento guardado" : (type==="g"?(plan?"Gasto planificado":"Gasto"):"Ingreso")+" de "+money(amount)+" apuntado"+(plan?" (fuera del presupuesto)":""));
  });
  const del = document.getElementById("fDel");
  if (del) del.addEventListener("click", () => {
    const box = document.getElementById("delBox");
    box.innerHTML = '<div class="confirm">¿Eliminar este movimiento?<div class="row"><button class="btn danger solid" type="button" id="dYes">Eliminar</button><button class="btn" type="button" id="dNo">Cancelar</button></div></div>';
    document.getElementById("dYes").addEventListener("click", () => { closeSheet(); removeMov(m, null); });
    document.getElementById("dNo").addEventListener("click", () => { box.innerHTML = ""; });
  });
}
function budgetAlert(cat, date, beforeCat, beforeAll){
  const c = catOf(cat), nowC = spentWeek(cat, date), nowA = spentBudgeted(date), B = totalBudget(); if (!c.budget) return null;
  if (c.budget && nowC > c.budget && beforeCat <= c.budget) return ["Te has pasado del límite semanal de "+c.name+" ("+money0(c.budget)+")", true];
  if (B && nowA > B && beforeAll <= B) return ["Te has pasado del presupuesto semanal ("+money0(B)+")", true];
  if (c.budget && nowC >= c.budget*.8 && beforeCat < c.budget*.8 && nowC <= c.budget) return ["Llevas el "+Math.round(nowC/c.budget*100)+" % del límite semanal de "+c.name, false];
  if (B && nowA >= B*.8 && beforeAll < B*.8 && nowA <= B) return ["Llevas el "+Math.round(nowA/B*100)+" % del presupuesto semanal", false];
  return null;
}

    +'<div class="grab"></div><h2 id="sT">'+(editing?'Editar fijo':'Nuevo fijo')+'</h2>'
    + segHTML(type) + amountHTML(editing ? f.amount : 0)
    +'<div class="field"><label for="fNote">Concepto</label><input id="fNote" maxlength="60" autocomplete="off" placeholder="Alquiler" value="'+(editing?esc(f.note||''):'')+'"></div>'
    +'<div class="field"><span class="lbl">Categoría</span><div class="cats" id="catBox"></div></div><div id="subBox"></div>'
    +'<div class="two"><div class="field"><label for="fDay">Día de cada mes</label><input id="fDay" type="number" min="1" max="31" inputmode="numeric" value="'+(editing?f.day:parse(today()).getDate())+'"></div>'
    +'<div class="field"><label for="fStart">Desde</label><input id="fStart" type="month" value="'+(editing?f.start:ym(today()))+'"></div></div>'
    +'<p class="hint">Si el mes tiene menos días, se apunta el último día del mes.'+(editing?' Los cambios se aplican a los próximos meses; lo ya apuntado no cambia.':'')+'</p>'
    +'<div class="actions">'+(editing?'<button class="btn danger" type="button" id="fDel">Eliminar</button>':'')+'<span class="grow"></span><button class="btn" type="button" id="fCancel">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div>'
    +'<div id="delBox"></div></form></div>';
  const amt = document.getElementById("fAmt"), err = document.getElementById("amtErr"), form = document.getElementById("form");
  const picker = catPicker(form, () => type);
  picker.draw(editing ? f.cat : null, editing ? f.sub : "");
  amt.addEventListener("input", () => { err.hidden = true; });
  form.querySelectorAll('input[name=fType]').forEach(r => r.addEventListener("change", () => { type = r.value; picker.draw(null, ""); }));
  document.getElementById("scrim").addEventListener("click", e => { if (e.target.id==="scrim") closeSheet(); });
  document.getElementById("fCancel").addEventListener("click", closeSheet);
  form.addEventListener("submit", e => {
    e.preventDefault();
    const amount = parseAmount(amt.value); if (!amount) { err.hidden = false; amt.focus(); return; }
    const day = Math.min(31, Math.max(1, parseInt(document.getElementById("fDay").value,10) || 1));
    const start = document.getElementById("fStart").value || ym(today());
    const data = Object.assign({type, amount, day, start, note:document.getElementById("fNote").value.trim()}, picker.value());
    if (editing) { Object.assign(f, data); delete f.ex; } else state.fixed.push(Object.assign({id:uid(), gen:[]}, data));
    runFixed(); save(); closeSheet(); render(); toast(editing ? "Fijo guardado" : "Fijo creado");
  });
  const del = document.getElementById("fDel");
  if (del) del.addEventListener("click", () => {
    const box = document.getElementById("delBox");
    box.innerHTML = '<div class="confirm">¿Eliminar este fijo? Los movimientos ya apuntados se mantienen.<div class="row"><button class="btn danger solid" type="button" id="dYes">Eliminar</button><button class="btn" type="button" id="dNo">Cancelar</button></div></div>';
    document.getElementById("dYes").addEventListener("click", () => { const idx = state.fixed.indexOf(f); state.fixed.splice(idx,1); save(); closeSheet(); render(); toast("Fijo eliminado", () => { state.fixed.splice(idx,0,f); save(); render(); }); });
    document.getElementById("dNo").addEventListener("click", () => { box.innerHTML = ""; });
  });
}

/* ---------- hoja de meta ---------- */
function openGoal(g){
  const editing = !!g;
  $sheet.innerHTML = '<div class="scrim" id="scrim"><form class="sheet" id="form" role="dialog" aria-modal="true" aria-labelledby="sT" novalidate>'
    +'<div class="grab"></div><h2 id="sT">'+(editing?esc(g.name):'Nueva meta')+'</h2>'
    +(editing ? '<p class="gnow">'+money(g.saved)+' <small>ahorrados de '+money(g.target)+'</small></p>'
      +'<div class="field"><label for="gAdd">Aportar o retirar dinero</label><div class="gsave" style="margin:0"><input id="gAdd" inputmode="decimal" autocomplete="off" placeholder="50"><button class="btn primary" type="button" id="gPlus">Aportar</button><button class="btn" type="button" id="gMinus">Retirar</button></div></div>'
      +'<p class="hint">Las aportaciones no cuentan como gasto en tus cuentas.</p>' : '')
    +'<div class="field"><label for="gName">Nombre</label><input id="gName" maxlength="40" autocomplete="off" placeholder="Viaje a Japón" value="'+(editing?esc(g.name):'')+'"></div>'
    +'<div class="two"><div class="field"><label for="gTarget">Objetivo (€)</label><input id="gTarget" inputmode="decimal" autocomplete="off" placeholder="1500" value="'+(editing?toInput(g.target):'')+'"></div>'
    +(editing ? '' : '<div class="field"><label for="gStart">Ya tengo (€)</label><input id="gStart" inputmode="decimal" autocomplete="off" placeholder="0"></div>')+'</div>'
    +'<div class="err" id="gErr" hidden>Pon un nombre y un objetivo mayor que cero.</div>'
    +'<div class="actions">'+(editing?'<button class="btn danger" type="button" id="fDel">Eliminar</button>':'')+'<span class="grow"></span><button class="btn" type="button" id="fCancel">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div>'
    +'<div id="delBox"></div></form></div>';
  const form = document.getElementById("form");
  document.getElementById("scrim").addEventListener("click", e => { if (e.target.id==="scrim") closeSheet(); });
  document.getElementById("fCancel").addEventListener("click", closeSheet);
  if (editing) {
    const move = sign => {
      const v = parseAmount(document.getElementById("gAdd").value); if (!v) { document.getElementById("gAdd").focus(); return; }
      const was = g.saved >= g.target;
      g.saved = Math.max(0, g.saved + sign*v); delete g.ex; save(); closeSheet(); render();
      if (!was && g.saved >= g.target) { celebrate(); toast("¡Meta conseguida: "+g.name+"!"); }
      else toast(sign>0 ? "Has aportado "+money(v)+" a "+g.name : "Has retirado "+money(v)+" de "+g.name);
    };
    document.getElementById("gPlus").addEventListener("click", () => move(1));
    document.getElementById("gMinus").addEventListener("click", () => move(-1));
  } else setTimeout(() => document.getElementById("gName").focus(), 80);
  form.addEventListener("submit", e => {
    e.preventDefault();
    const name = document.getElementById("gName").value.trim(), target = parseAmount(document.getElementById("gTarget").value);
    if (!name || !target) { document.getElementById("gErr").hidden = false; return; }
    if (editing) { Object.assign(g, {name, target}); delete g.ex; }
    else state.goals.push({id:uid(), name, target, saved: parseAmount((document.getElementById("gStart")||{}).value)});
    save(); closeSheet(); render(); toast(editing ? "Meta guardada" : "Meta creada");
  });
  const del = document.getElementById("fDel");
  if (del) del.addEventListener("click", () => {
    const box = document.getElementById("delBox");
    box.innerHTML = '<div class="confirm">¿Eliminar esta meta?<div class="row"><button class="btn danger solid" type="button" id="dYes">Eliminar</button><button class="btn" type="button" id="dNo">Cancelar</button></div></div>';
    document.getElementById("dYes").addEventListener("click", () => { const idx = state.goals.indexOf(g); state.goals.splice(idx,1); save(); closeSheet(); render(); toast("Meta eliminada", () => { state.goals.splice(idx,0,g); save(); render(); }); });
    document.getElementById("dNo").addEventListener("click", () => { box.innerHTML = ""; });
  });
}
function closeSheet(){ $sheet.innerHTML = ""; }
document.addEventListener("keydown", e => { if (e.key==="Escape" && $sheet.innerHTML) closeSheet(); });

/* ---------- avisos ---------- */
let toastTimer;
function toast(msg, undo, alert){
  const root = document.getElementById("toastRoot"); clearTimeout(toastTimer);
  root.innerHTML = '<div class="toast'+(alert?' alert':'')+'" role="status"><span>'+esc(msg)+'</span>'+(undo?'<button type="button" id="undo">Deshacer</button>':'')+'</div>';
  if (undo) document.getElementById("undo").addEventListener("click", () => { root.innerHTML = ""; undo(); });
  toastTimer = setTimeout(() => { root.innerHTML = ""; }, alert ? 5000 : 3500);
}

/* ---------- fuegos dorados ---------- */
function celebrate(){
  try { if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return; } catch(e) {}
  const cv = document.getElementById("fx"), ctx = cv.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio||1, 2), W = innerWidth, H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); cv.hidden = false;
  const cols = ["#D2B67E","#E4CB94","#F6F1E6","#B8954F","#74B796"], parts = [];
  const burst = (x,y) => { const c1 = cols[Math.floor(Math.random()*cols.length)], c2 = cols[Math.floor(Math.random()*cols.length)];
    for (let i=0;i<46;i++){ const a = (Math.PI*2*i)/46 + Math.random()*.1, sp = 2.2 + Math.random()*2.6; parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,c:i%3?c1:c2,r:2+Math.random()*1.6}); } };
  [[.3,.28,0],[.7,.22,280],[.5,.36,560],[.22,.42,860],[.78,.4,1050]].forEach(([fx,fy,t]) => setTimeout(() => burst(W*fx, H*fy), t));
  const t0 = performance.now();
  (function frame(now){
    ctx.clearRect(0,0,W,H);
    for (const p of parts){ p.vx *= .985; p.vy = p.vy*.985 + .05; p.x += p.vx; p.y += p.vy; p.life -= .012; if (p.life <= 0) continue; ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); }
    ctx.globalAlpha = 1;
    if (now - t0 < 2900) requestAnimationFrame(frame); else { ctx.clearRect(0,0,W,H); cv.hidden = true; }
  })(t0);
}

/* Celebración al empezar una semana nueva si la anterior se cumplió */
function checkWeek(){
  const cur = monday(today());
  if (state.lastWeekSeen && state.lastWeekSeen < cur && weekOk(addDays(cur,-7)) === true) {
    const n = streak();
    setTimeout(() => { celebrate(); toast("¡Semana cumplida! Llevas "+n+" semana"+(n>1?"s":"")+" seguida"+(n>1?"s":"")+" dentro del presupuesto"); }, 600);
  }
  state.lastWeekSeen = cur; save();
}

let lastDay = today();
const newDay = () => { lastDay = today(); dayCursor = lastDay; weekCursor = monday(lastDay); monthCursor = ym(lastDay); runFixed(); save(); render(); checkWeek(); checkChallenges(false); };
document.addEventListener("visibilitychange", () => { if (!document.hidden && today() !== lastDay) newDay(); });
setInterval(() => { if (today() !== lastDay) newDay(); }, 60000);

if ("serviceWorker" in navigator && document.querySelector('link[rel="manifest"]')) navigator.serviceWorker.register("sw.js").catch(() => {});

render();
checkWeek();
checkChallenges(false);
})();
